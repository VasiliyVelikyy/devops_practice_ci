server:
  port: 8090

spring:
  application:
    name: hotel-reservation

  profiles:
    default: local

  outbox:
    polling:
      delay:
        ms: 5000
      batch-size: 100

  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.apache.kafka: OFF
    org.springframework.kafka: OFF
    org.apache.kafka.clients.consumer: OFF
    org.apache.kafka.clients.NetworkClient: OFF
    org.springframework.boot.autoconfigure.kafka: OFF
    org.springframework.beans: OFF

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: true